- name: print username and passsword
  hosts: local
  connection: local
  vars_prompt:
  - name: username
    prompt: please enter your name
    private: false

  - name: passsword
    prompt: please enter your passsword
    private: true

  tasks:
  - name: print info
    ansible.builtin.debug:
      msg: "username is: {{ username }}, password is {{ passsword }}"

