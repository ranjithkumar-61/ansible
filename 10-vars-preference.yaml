- name: variable properties
  hosts: local
  connection: local
  vars:
    NAME: "ANSIBLE from PLAY"
  vars_files:
  - course.yaml
  vars_prompt:
  - name: NAME
    prompt: please enter name
    private: false
  tasks:
  - name: print name
    vars:
      NAME: "Ansible from Task"
    ansible.builtin.debug:
      msg: "HI {{ NAME }}"
    


#Priority of printing variables
# 1. Arguments
# 2. Task
# 3. vars_files
# 4. Prompt
# 5. Play
# 6. Inventory
