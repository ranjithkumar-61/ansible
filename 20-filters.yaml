- name: Demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, terraform, ansible
  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi Reddy, {{ GREETING | default('Good morning') }}"

  - name: convert string to list
    ansible.builtin.debug:
      msg: "{{ topics | split(',') }}"